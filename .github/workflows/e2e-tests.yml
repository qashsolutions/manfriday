name: Browser tests

# Opens real pages in Chromium and in WebKit at phone size. Everything the unit
# suites cannot see: rendering, links, console errors, sideways scroll, and the
# signed-in screens.
#
# Repository secrets this needs (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY  required — without it the app cannot boot
#   NEXT_PUBLIC_CONVEX_URL             required — the deployment the app reads
#   CLERK_SECRET_KEY                   required for the Clerk testing token
#   E2E_TEST_EMAIL                     optional — signed-in and flow specs skip without it
#   CONVEX_DEPLOYMENT                  optional — lets the run reseed the flow fixture
#   CONVEX_DEPLOY_KEY                  optional — same
# With none of them set the job reports that it is not configured and stops,
# rather than failing a build for a missing secret.

on:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/e2e-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/e2e/**"

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Are the secrets configured?
        id: cfg
        env:
          PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CONVEX: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
        run: |
          if [ -n "$PK" ] && [ -n "$CONVEX" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser tests skipped — set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and NEXT_PUBLIC_CONVEX_URL as repository secrets to turn them on."
          fi

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }

      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'

      - name: Cache browsers
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium webkit
        if: steps.cfg.outputs.ready == 'true'

      - run: npx playwright test
        if: steps.cfg.outputs.ready == 'true'
        env:
          CI: "true"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Keep the report when something fails
        if: failure() && steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
