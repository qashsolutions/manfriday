name: Convex function tests
on:
  push:
    paths: ["convex/**", "vitest.config.mts", "package.json", ".github/workflows/convex-tests.yml"]
  pull_request:
    paths: ["convex/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
