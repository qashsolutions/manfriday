[project]
name = "highway"
version = "0.1.0"
description = "Four-lane paper-trading bot: crypto and stocks, $50 buys, strategy tournaments"
readme = "README.md"
authors = [
    { name = "qashsolutions", email = "qash.dallas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "vadersentiment>=3.3.2",
]

[project.scripts]
highway = "highway.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Only ever collect from tests/. Without this, bare `pytest` walks the whole project and
# IMPORTS anything matching test_*.py or *_test.py - which ran scripts/measure/edge_test.py
# (a year of bars and twelve tournament replays) on every test run, taking 280 seconds.
# The harness is now edge_check.py, and this makes the class of mistake impossible.
testpaths = ["tests"]
