[project]
name = "highway"
version = "0.1.0"
description = "Four-lane paper-trading bot: crypto and stocks, $50 buys, strategy tournaments"
readme = "README.md"
authors = [
    { name = "qashsolutions", email = "qash.dallas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "vadersentiment>=3.3.2",
]

[project.scripts]
highway = "highway.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
