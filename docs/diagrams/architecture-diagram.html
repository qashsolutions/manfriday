<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f7f6fa;font-family:"Instrument Sans",system-ui,sans-serif;color:#14131a}
.display{font-family:"Archivo",sans-serif;font-stretch:112%;font-weight:800}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace;font-weight:500;letter-spacing:.08em}
svg text{font-family:"Instrument Sans",system-ui,sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200"><defs><marker id="ah-dim" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4960"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63e5c"/></marker><marker id="ah-mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e9f74"/></marker><marker id="ah-amb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a97b10"/></marker></defs><text x="80" y="70" class="display" font-size="34" fill="#14131a">System architecture</text><text x="80" y="100" font-size="16" fill="#4d4960">How Man Friday uses Google OAuth 2.0 and the YouTube Data API v3 — data flow, storage, and revocation</text><text x="1840" y="70" text-anchor="end" class="mono" font-size="12" fill="#e63e5c">MAN FRIDAY · manfriday.app · Google Cloud project 845649489196</text><text x="1840" y="96" text-anchor="end" class="mono" font-size="12" fill="#4d4960">11 SEP 2026 · operated by Qash Solutions</text><text x="80" y="150" class="mono" font-size="12" fill="#e63e5c">USER · RENDER</text><text x="480" y="150" class="mono" font-size="12" fill="#e63e5c">MAN FRIDAY · APPLICATION (Vercel + Convex)</text><text x="1500" y="150" class="mono" font-size="12" fill="#e63e5c">GOOGLE · EXTERNAL</text><rect x="80" y="180" width="320" height="140" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="100" y="206" class="mono" font-size="11" fill="#e63e5c">PERSON</text><text x="100" y="236" font-size="19" font-weight="700" fill="#14131a">Solo builder</text><text x="100" y="264" font-size="14" fill="#4d4960">Browser, any device</text><text x="100" y="286" font-size="14" fill="#4d4960">Reviews and approves every video</text><text x="100" y="308" font-size="14" fill="#4d4960">Signs in with Clerk (passkey / 2FA)</text><rect x="480" y="180" width="420" height="140" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="500" y="206" class="mono" font-size="11" fill="#e63e5c">FRONTEND</text><text x="500" y="236" font-size="19" font-weight="700" fill="#14131a">Web app — Next.js on Vercel</text><text x="500" y="264" font-size="14" fill="#4d4960">manfriday.app · Picks, Calendar, Settings</text><text x="500" y="286" font-size="14" fill="#4d4960">Settings › Connected accounts</text><text x="500" y="308" font-size="14" fill="#4d4960">Google is never a sign-in provider</text><rect x="480" y="360" width="620" height="370" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="500" y="386" class="mono" font-size="11" fill="#0e9f74">BACKEND</text><text x="500" y="416" font-size="19" font-weight="700" fill="#14131a">Convex — database, scheduler, server actions</text><text x="500" y="444" font-size="14" fill="#4d4960">oauth.ts — callback, token exchange, refresh, revoke at Google</text><text x="500" y="466" font-size="14" fill="#4d4960">publishing.ts — scheduled publish action → videos.insert (resumable)</text><text x="500" y="488" font-size="14" fill="#4d4960">stats.ts — daily videos.list (≤50 ids/call) for videos we published</text><text x="500" y="510" font-size="14" fill="#4d4960"></text><text x="500" y="532" font-size="14" fill="#4d4960">Stored per connected YouTube account (Convex, encrypted at rest):</text><text x="500" y="554" font-size="14" fill="#4d4960">  • access + refresh token · channel ID + name (channels.list, once)</text><text x="500" y="576" font-size="14" fill="#4d4960">  • per video WE published: video ID, title, publish time, view count</text><text x="500" y="598" font-size="14" fill="#4d4960">Deleted within 7 days of disconnect or account deletion.</text><text x="500" y="620" font-size="14" fill="#4d4960">Refresh tokens rotated; expired data never served to the user.</text><rect x="80" y="360" width="320" height="370" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="100" y="386" class="mono" font-size="11" fill="#a97b10">MEDIA PIPELINE</text><text x="100" y="416" font-size="19" font-weight="700" fill="#14131a">Render worker (Python + ffmpeg)</text><text x="100" y="444" font-size="14" fill="#4d4960">Runs on Railway; long-polls Convex</text><text x="100" y="466" font-size="14" fill="#4d4960">for render jobs</text><text x="100" y="488" font-size="14" fill="#4d4960"></text><text x="100" y="510" font-size="14" fill="#4d4960">Builds the MP4: brand screenshots,</text><text x="100" y="532" font-size="14" fill="#4d4960">gradients, captions, voice track</text><text x="100" y="554" font-size="14" fill="#4d4960">Uses FAL (TTS, lipsync), Sarvam</text><text x="100" y="576" font-size="14" fill="#4d4960">(Indic TTS), Claude API (script text)</text><text x="100" y="598" font-size="14" fill="#4d4960"></text><text x="100" y="620" font-size="14" fill="#4d4960">Makes NO YouTube API calls.</text><text x="100" y="642" font-size="14" fill="#4d4960">Never sees OAuth tokens.</text><rect x="480" y="780" width="620" height="120" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="500" y="806" class="mono" font-size="11" fill="#e63e5c">SUPPORTING SERVICES</text><text x="500" y="836" font-size="19" font-weight="700" fill="#14131a">Clerk (auth) · Stripe (billing) · Resend (email)</text><text x="500" y="864" font-size="14" fill="#4d4960">PostHog (product analytics) · Axiom (logs) — none of these receive YouTube data</text><rect x="1500" y="180" width="340" height="550" rx="16" fill="#f1eff6" stroke="#d9d6e2" stroke-width="2"/><text x="1520" y="210" class="mono" font-size="11" fill="#e63e5c">GOOGLE</text><rect x="1520" y="230" width="300" height="170" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="1540" y="264" font-size="18" font-weight="700" fill="#14131a">OAuth 2.0</text><text x="1540" y="292" font-size="14" fill="#4d4960">Consent screen with two scopes:</text><text x="1540" y="314" font-size="14" fill="#4d4960">youtube.upload · youtube.readonly</text><text x="1540" y="336" font-size="14" fill="#4d4960">Token + revoke endpoints</text><text x="1540" y="358" font-size="14" fill="#4d4960">User can also revoke at</text><text x="1540" y="380" font-size="14" fill="#4d4960">myaccount.google.com › Security</text><rect x="1520" y="430" width="300" height="280" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="1540" y="464" font-size="18" font-weight="700" fill="#14131a">YouTube Data API v3</text><text x="1540" y="492" font-size="14" fill="#4d4960">videos.insert · 1,600 units</text><text x="1540" y="514" font-size="14" fill="#4d4960">  one approved video → Short</text><text x="1540" y="536" font-size="14" fill="#4d4960">channels.list · 1 unit</text><text x="1540" y="558" font-size="14" fill="#4d4960">  channel ID + name, at connect</text><text x="1540" y="580" font-size="14" fill="#4d4960">videos.list · 1 unit</text><text x="1540" y="602" font-size="14" fill="#4d4960">  view count, our videos only</text><text x="1540" y="624" font-size="14" fill="#4d4960"></text><text x="1540" y="646" font-size="14" fill="#4d4960">Only the user's own channel.</text><text x="1540" y="668" font-size="14" fill="#4d4960">No search.list, comments, other channels.</text><rect x="1500" y="780" width="340" height="120" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="1520" y="806" class="mono" font-size="11" fill="#4d4960">OTHER PLATFORM</text><text x="1520" y="836" font-size="19" font-weight="700" fill="#14131a">TikTok Content Posting API</text><text x="1520" y="864" font-size="14" fill="#4d4960">Same user-approval pattern</text><text x="1520" y="886" font-size="14" fill="#4d4960">(not part of this request)</text><path d="M400,240 L480,240" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><circle cx="440.0" cy="240.0" r="14" fill="#4d4960"/><text x="440.0" y="245.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><path d="M900,240 L1500,240" fill="none" stroke="#e63e5c" stroke-width="2.2" marker-end="url(#ah-acc)" /><circle cx="1200.0" cy="240.0" r="14" fill="#e63e5c"/><text x="1200.0" y="245.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="1200.0" y="218.0" text-anchor="middle" class="mono" font-size="11" fill="#e63e5c">consent request</text><path d="M1500,300 L1000,300 L1000,360" fill="none" stroke="#e63e5c" stroke-width="2.2" marker-end="url(#ah-acc)" /><circle cx="1250.0" cy="300.0" r="14" fill="#e63e5c"/><text x="1250.0" y="305.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="1250.0" y="278.0" text-anchor="middle" class="mono" font-size="11" fill="#e63e5c">auth code → tokens</text><path d="M690,320 L690,360" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><circle cx="690.0" cy="340.0" r="14" fill="#4d4960"/><text x="690.0" y="345.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><path d="M1100,400 L1500,400" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" stroke-dasharray="7 6"/><circle cx="1300.0" cy="400.0" r="14" fill="#4d4960"/><text x="1300.0" y="405.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">8</text><text x="1300.0" y="378.0" text-anchor="middle" class="mono" font-size="11" fill="#4d4960">revoke on disconnect</text><path d="M1100,520 L1500,520" fill="none" stroke="#e63e5c" stroke-width="2.2" marker-end="url(#ah-acc)" /><circle cx="1300.0" cy="520.0" r="14" fill="#e63e5c"/><text x="1300.0" y="525.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">6</text><text x="1300.0" y="498.0" text-anchor="middle" class="mono" font-size="11" fill="#e63e5c">videos.insert</text><path d="M1500,600 L1100,600" fill="none" stroke="#0e9f74" stroke-width="2.2" marker-end="url(#ah-mint)" stroke-dasharray="7 6"/><circle cx="1300.0" cy="600.0" r="14" fill="#0e9f74"/><text x="1300.0" y="605.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">7</text><text x="1300.0" y="578.0" text-anchor="middle" class="mono" font-size="11" fill="#0e9f74">videos.list, once a day</text><path d="M480,520 L400,520" fill="none" stroke="#a97b10" stroke-width="2.2" marker-end="url(#ah-amb)" /><circle cx="440.0" cy="520.0" r="14" fill="#a97b10"/><text x="440.0" y="525.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text><text x="440.0" y="498.0" text-anchor="middle" class="mono" font-size="11" fill="#a97b10">render job</text><path d="M400,600 L480,600" fill="none" stroke="#a97b10" stroke-width="2.2" marker-end="url(#ah-amb)" /><text x="440.0" y="578.0" text-anchor="middle" class="mono" font-size="11" fill="#a97b10">MP4</text><rect x="80" y="940" width="1760" height="220" rx="14" fill="#f1eff6"/><text x="100" y="970" class="mono" font-size="12" fill="#e63e5c">DATA FLOW</text><circle cx="108" cy="997" r="12" fill="#14131a"/><text x="108" y="1001" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="130" y="1002" font-size="14" fill="#14131a">User signs in (Clerk) and opens Settings › Connected accounts › Connect YouTube.</text><circle cx="988" cy="997" r="12" fill="#14131a"/><text x="988" y="1001" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="1010" y="1002" font-size="14" fill="#14131a">App redirects to Google's consent screen requesting youtube.upload and youtube.readonly.</text><circle cx="108" cy="1033" r="12" fill="#14131a"/><text x="108" y="1037" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="130" y="1038" font-size="14" fill="#14131a">Google returns an authorization code; Convex exchanges it for tokens and calls channels.list once.</text><circle cx="988" cy="1033" r="12" fill="#14131a"/><text x="988" y="1037" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="1010" y="1038" font-size="14" fill="#14131a">User approves videos in Picks and schedules them in Calendar — one approval = one upload.</text><circle cx="108" cy="1069" r="12" fill="#14131a"/><text x="108" y="1073" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="130" y="1074" font-size="14" fill="#14131a">Render worker builds the MP4 for each approved video and hands it back to Convex.</text><circle cx="988" cy="1069" r="12" fill="#14131a"/><text x="988" y="1073" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="1010" y="1074" font-size="14" fill="#14131a">At the scheduled time a Convex action uploads the video with videos.insert to the user's own channel.</text><circle cx="108" cy="1105" r="12" fill="#14131a"/><text x="108" y="1109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="130" y="1110" font-size="14" fill="#14131a">Once a day, videos.list refreshes the view count of videos Man Friday published (dashed = read-only).</text><circle cx="988" cy="1105" r="12" fill="#14131a"/><text x="988" y="1109" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><text x="1010" y="1110" font-size="14" fill="#14131a">Disconnect or account deletion revokes the token at Google and deletes stored tokens + video metadata within 7 days.</text></svg></body></html>
