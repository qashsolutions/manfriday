</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240"><defs><marker id="ah-dim" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d4960"/></marker><marker id="ah-acc" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e63e5c"/></marker><marker id="ah-mint" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e9f74"/></marker><marker id="ah-amb" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a97b10"/></marker></defs><text x="80" y="70" class="display" font-size="34" fill="#14131a">User flows</text>
<text x="80" y="100" font-size="16" fill="#4d4960">Four flows that touch Google OAuth or the YouTube Data API — every YouTube call is the direct result of a user action</text>
<text x="1840" y="70" text-anchor="end" class="mono" font-size="12" fill="#e63e5c">MAN FRIDAY · manfriday.app · Google Cloud project 845649489196</text>
<text x="1840" y="96" text-anchor="end" class="mono" font-size="12" fill="#4d4960">11 SEP 2026 · operated by Qash Solutions</text><text x="80" y="160" class="display" font-size="22" fill="#14131a">A · Connect a YouTube channel</text><text x="80" y="182" class="mono" font-size="12" fill="#e63e5c">GOOGLE OAUTH 2.0 · channels.list ×1</text><rect x="80" y="200" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="96" y="226" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 1</text><text x="96" y="254" font-size="17" font-weight="600" fill="#14131a">Settings › Connected accounts</text><text x="96" y="280" font-size="13" fill="#4d4960">User clicks Connect next to</text><text x="96" y="300" font-size="13" fill="#4d4960">YouTube Shorts</text><path d="M350,275 L378,275" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="378" y="200" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="394" y="226" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 2</text><text x="394" y="254" font-size="17" font-weight="600" fill="#14131a">MFA gate</text><text x="394" y="280" font-size="13" fill="#4d4960">Passkey or 2FA required before</text><text x="394" y="300" font-size="13" fill="#4d4960">any social account can connect</text><path d="M648,275 L676,275" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="676" y="200" width="270" height="150" rx="14" fill="#f1eff6" stroke="#e63e5c" stroke-width="3"/><text x="692" y="226" class="mono" font-size="11" fill="#e63e5c">GOOGLE · STEP 3</text><text x="692" y="254" font-size="17" font-weight="600" fill="#14131a">Google consent screen</text><text x="692" y="280" font-size="13" fill="#4d4960">Scopes shown: upload videos,</text><text x="692" y="300" font-size="13" fill="#4d4960">view YouTube account · user</text><text x="692" y="320" font-size="13" fill="#4d4960">clicks Continue or Cancel</text><path d="M946,275 L974,275" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="974" y="200" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="990" y="226" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 4</text><text x="990" y="254" font-size="17" font-weight="600" fill="#14131a">OAuth callback</text><text x="990" y="280" font-size="13" fill="#4d4960">Code exchanged for tokens,</text><text x="990" y="300" font-size="13" fill="#4d4960">stored in Convex (encrypted at rest)</text><path d="M1244,275 L1272,275" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1272" y="200" width="270" height="150" rx="14" fill="#f1eff6" stroke="#e63e5c" stroke-width="3"/><text x="1288" y="226" class="mono" font-size="11" fill="#e63e5c">GOOGLE · STEP 5</text><text x="1288" y="254" font-size="17" font-weight="600" fill="#14131a">channels.list (1 unit)</text><text x="1288" y="280" font-size="13" fill="#4d4960">Reads channel ID + name of the</text><text x="1288" y="300" font-size="13" fill="#4d4960">connected account, once</text><path d="M1542,275 L1570,275" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1570" y="200" width="270" height="150" rx="14" fill="#ffffff" stroke="#0e9f74" stroke-width="3"/><text x="1586" y="226" class="mono" font-size="11" fill="#0e9f74">RESULT · STEP 6</text><text x="1586" y="254" font-size="17" font-weight="600" fill="#14131a">Connected</text><text x="1586" y="280" font-size="13" fill="#4d4960">Settings shows the channel name</text><text x="1586" y="300" font-size="13" fill="#4d4960">and a Disconnect control</text><text x="80" y="440" class="display" font-size="22" fill="#14131a">B · Approve and publish a Short</text><text x="80" y="462" class="mono" font-size="12" fill="#e63e5c">videos.insert ×1 per approved video</text><rect x="80" y="480" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="96" y="506" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 1</text><text x="96" y="534" font-size="17" font-weight="600" fill="#14131a">Picks feed</text><text x="96" y="560" font-size="13" fill="#4d4960">Friday drafts videos about the</text><text x="96" y="580" font-size="13" fill="#4d4960">user's product from its URL</text><path d="M350,555 L378,555" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="378" y="480" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="394" y="506" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 2</text><text x="394" y="534" font-size="17" font-weight="600" fill="#14131a">Keep (approve)</text><text x="394" y="560" font-size="13" fill="#4d4960">User right-swipes a video; only</text><text x="394" y="580" font-size="13" fill="#4d4960">approved videos can ever be published</text><path d="M648,555 L676,555" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="676" y="480" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="692" y="506" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 3</text><text x="692" y="534" font-size="17" font-weight="600" fill="#14131a">Render</text><text x="692" y="560" font-size="13" fill="#4d4960">Worker builds the final MP4</text><text x="692" y="580" font-size="13" fill="#4d4960">(captions, voice, brand visuals)</text><path d="M946,555 L974,555" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="974" y="480" width="270" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="990" y="506" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 4</text><text x="990" y="534" font-size="17" font-weight="600" fill="#14131a">Calendar › Schedule</text><text x="990" y="560" font-size="13" fill="#4d4960">User picks YouTube Shorts and</text><text x="990" y="580" font-size="13" fill="#4d4960">a posting time</text><path d="M1244,555 L1272,555" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1272" y="480" width="270" height="150" rx="14" fill="#f1eff6" stroke="#e63e5c" stroke-width="3"/><text x="1288" y="506" class="mono" font-size="11" fill="#e63e5c">GOOGLE · STEP 5</text><text x="1288" y="534" font-size="17" font-weight="600" fill="#14131a">videos.insert (1,600 units)</text><text x="1288" y="560" font-size="13" fill="#4d4960">Resumable upload to the user's</text><text x="1288" y="580" font-size="13" fill="#4d4960">own channel at the scheduled time</text><path d="M1542,555 L1570,555" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1570" y="480" width="270" height="150" rx="14" fill="#ffffff" stroke="#0e9f74" stroke-width="3"/><text x="1586" y="506" class="mono" font-size="11" fill="#0e9f74">RESULT · STEP 6</text><text x="1586" y="534" font-size="17" font-weight="600" fill="#14131a">Queue: YOUTUBE · LIVE</text><text x="1586" y="560" font-size="13" fill="#4d4960">Status and link shown in</text><text x="1586" y="580" font-size="13" fill="#4d4960">the publish queue</text><text x="80" y="720" class="display" font-size="22" fill="#14131a">C · See how a published Short performed</text><text x="80" y="742" class="mono" font-size="12" fill="#e63e5c">videos.list ×1 per published video per day</text><rect x="80" y="760" width="419" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="96" y="786" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 1</text><text x="96" y="814" font-size="17" font-weight="600" fill="#14131a">Daily scheduler</text><text x="96" y="840" font-size="13" fill="#4d4960">Convex cron runs once a day</text><path d="M499,835 L527,835" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="527" y="760" width="419" height="150" rx="14" fill="#f1eff6" stroke="#e63e5c" stroke-width="3"/><text x="543" y="786" class="mono" font-size="11" fill="#e63e5c">GOOGLE · STEP 2</text><text x="543" y="814" font-size="17" font-weight="600" fill="#14131a">videos.list (1 unit each)</text><text x="543" y="840" font-size="13" fill="#4d4960">Only IDs of videos Man Friday</text><text x="543" y="860" font-size="13" fill="#4d4960">published are requested</text><path d="M946,835 L974,835" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="974" y="760" width="419" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="990" y="786" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 3</text><text x="990" y="814" font-size="17" font-weight="600" fill="#14131a">Store view count</text><text x="990" y="840" font-size="13" fill="#4d4960">Kept while the account stays</text><text x="990" y="860" font-size="13" fill="#4d4960">connected; no other channel data</text><path d="M1393,835 L1421,835" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1421" y="760" width="419" height="150" rx="14" fill="#ffffff" stroke="#0e9f74" stroke-width="3"/><text x="1437" y="786" class="mono" font-size="11" fill="#0e9f74">RESULT · STEP 4</text><text x="1437" y="814" font-size="17" font-weight="600" fill="#14131a">Queue row + dashboard</text><text x="1437" y="840" font-size="13" fill="#4d4960">"YOUTUBE · LIVE · 41 views" and,</text><text x="1437" y="860" font-size="13" fill="#4d4960">with tracked links, which post</text><text x="1437" y="880" font-size="13" fill="#4d4960">sent visitors to the product</text><text x="80" y="1000" class="display" font-size="22" fill="#14131a">D · Disconnect or delete account</text><text x="80" y="1022" class="mono" font-size="12" fill="#e63e5c">Google revoke endpoint · deletion within 7 days</text><rect x="80" y="1040" width="419" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="96" y="1066" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 1</text><text x="96" y="1094" font-size="17" font-weight="600" fill="#14131a">Settings › Disconnect</text><text x="96" y="1120" font-size="13" fill="#4d4960">Or Settings › Your data › Delete</text><text x="96" y="1140" font-size="13" fill="#4d4960">account</text><path d="M499,1115 L527,1115" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="527" y="1040" width="419" height="150" rx="14" fill="#f1eff6" stroke="#e63e5c" stroke-width="3"/><text x="543" y="1066" class="mono" font-size="11" fill="#e63e5c">GOOGLE · STEP 2</text><text x="543" y="1094" font-size="17" font-weight="600" fill="#14131a">Revoke at Google</text><text x="543" y="1120" font-size="13" fill="#4d4960">Convex calls oauth2.googleapis.com/</text><text x="543" y="1140" font-size="13" fill="#4d4960">revoke with the stored token</text><path d="M946,1115 L974,1115" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="974" y="1040" width="419" height="150" rx="14" fill="#ffffff" stroke="#d9d6e2" stroke-width="2"/><text x="990" y="1066" class="mono" font-size="11" fill="#4d4960">MAN FRIDAY · STEP 3</text><text x="990" y="1094" font-size="17" font-weight="600" fill="#14131a">Delete stored data</text><text x="990" y="1120" font-size="13" fill="#4d4960">Tokens, channel ID, video IDs and</text><text x="990" y="1140" font-size="13" fill="#4d4960">view counts removed within 7 days</text><path d="M1393,1115 L1421,1115" fill="none" stroke="#4d4960" stroke-width="2.2" marker-end="url(#ah-dim)" /><rect x="1421" y="1040" width="419" height="150" rx="14" fill="#ffffff" stroke="#0e9f74" stroke-width="3"/><text x="1437" y="1066" class="mono" font-size="11" fill="#0e9f74">RESULT · STEP 4</text><text x="1437" y="1094" font-size="17" font-weight="600" fill="#14131a">Done</text><text x="1437" y="1120" font-size="13" fill="#4d4960">Videos already on the user's</text><text x="1437" y="1140" font-size="13" fill="#4d4960">channel are unaffected · user can</text><text x="1437" y="1160" font-size="13" fill="#4d4960">also revoke at myaccount.google.com</text><text x="80" y="1200" font-size="14" fill="#4d4960">Legend: red border = Google / YouTube API call · green border = visible outcome · every API call is initiated by an explicit user action; no bulk or automated uploads.</text></svg></body></html>
